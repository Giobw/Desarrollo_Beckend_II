spring.application.name=backendpetsalud

# Base de datos (credenciales por variables de entorno; nunca subir contrasenas reales al repositorio)
spring.datasource.url=jdbc:mysql://localhost:3307/petsalud_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:cambiar_esta_contrasena}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT: el secreto debe venir de la variable de entorno JWT_SECRET (Base64, minimo 256 bits).
# El valor por defecto es SOLO para desarrollo local.
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LXBldHNhbHVkLWNhbWJpYXItZW4tcHJvZHVjY2lvbi0hIQ==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Monitoreo de actividad sospechosa (bloqueo temporal por intentos fallidos de login)
security.login.max-attempts=5
security.login.lock-minutes=15

logging.level.com.petsalud.backendpetsalud.security=INFO

app.seed-demo-users=true
